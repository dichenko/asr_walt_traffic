name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-walt-traffic
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WALT_TRAFFIC_HOST }}
          username: ${{ secrets.WALT_TRAFFIC_USER }}
          key: ${{ secrets.WALT_TRAFFIC_SSH_KEY }}
          port: ${{ secrets.WALT_TRAFFIC_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/asr_walt_traffic
            git pull --ff-only
            sh scripts/deploy.sh
